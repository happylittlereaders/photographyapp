<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Golden Number</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#dcc86f" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      color: #dcc86f;
    }
    .wrap { text-align: center; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #dcc86f;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div>Loading Golden Number…</div>
  </div>

  <script>
    // Capacitor's server.url in capacitor.config.json takes over on native
    // builds, so this file only actually renders in a plain browser (PWA
    // install path). In that case, redirect straight to the live app.
    if (!window.Capacitor) {
      window.location.replace("https://goldennumber.streamlit.app");
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
</body>
</html>
